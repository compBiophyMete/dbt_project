version: 2

models:
  - name: fct_activities
    description: >
      Pipedrive sales activities that were done: a call or meeting held for a deal by a user. The
      public fact for activity questions (done calls per month, rep or type). Only done activities are
      here, so a completion rate can't be computed from it.


      **Grain**: one row per activity and deal (`activity_id`, `deal_id`). **Join on both**: some
      `activity_id`s are reused on two deals. Factless: count rows.


      **Dimensions**: `assigned_user_id` → `dim_users`, `activity_type_id` → `dim_activity_types`.
      `deal_id` has no tested link to a deal dimension (see `has_known_deal`).


      **Transformations and business logic**: `int_activities_filtered_to_done` (the done filter is
      applied there), plus `has_known_deal`: whether the activity's `deal_id` is in `int_deals`
      (an `exists` check, so no row is multiplied). It is computed here, where it is used, so the
      activity models and the funnel that reads them don't depend on the deal models.


      **Edge cases**:

      - Activities barely link to deals: filter on `has_known_deal` before joining to deal facts, or the result is nearly empty. Evidence: `analyses/profile_activity_deal_linkage.sql`.

      - Done Follow Up Calls (`follow_up`, an inactive type) are included.

      - `due_at` is the planned date, the only activity date; for a done activity it stands in for when it happened.


      **Refresh**: table, rebuilt daily on every `dbt run`. The source is a static load, so no
      freshness check.
    config:
      tags: ["pipedrive", "daily"]
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:   # the grain: (activity_id, deal_id)
          arguments:
            combination_of_columns: ["activity_id", "deal_id"]
      - dbt_utils.equal_rowcount:   # no row dropped or multiplied on the way to the mart
          arguments:
            compare_model: ref('int_activities_filtered_to_done')
    columns:
      - name: activity_id
        description: "{{ doc('activity__activity_id') }}"
        data_type: integer
        constraints:
          - type: not_null   # part of the grain
      - name: deal_id
        description: "{{ doc('deal_id') }}"
        data_type: integer
        constraints:
          - type: not_null   # part of the grain
      - name: assigned_user_id
        description: "{{ doc('activity__assigned_to_user') }}"
        data_type: integer
        data_tests:
          - relationships:   # every assignee is a user in the conformed dimension
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: activity_type_id
        description: "{{ doc('activity_types__id') }}"
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - relationships:   # every activity's type is in the conformed dimension
              arguments:
                to: ref('dim_activity_types')
                field: activity_type_id
      - name: activity_type
        description: "{{ doc('activity_type') }}"
        data_type: character varying(50)
        constraints:
          - type: not_null
      - name: activity_type_name
        description: "{{ doc('activity_types__name') }}"
        data_type: character varying(255)
      - name: has_known_deal
        description: "{{ doc('has_known_deal') }}"
        data_type: boolean
        constraints:
          - type: not_null
      - name: due_at
        description: "{{ doc('activity__due_to') }}"
        data_type: timestamp without time zone
        constraints:
          - type: not_null   # a done activity needs a date to be counted in a month
