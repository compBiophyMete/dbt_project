version: 2

models:
  - name: int_activities_joined_to_types
    description: >
      Pipedrive sales activities with their activity type's name and active state. The activity
      building block for activity KPIs (e.g. the Sales Call 1 / Sales Call 2 steps of
      `rep_sales_funnel_monthly`, activity counts per user or deal).


      **Grain**: one row per activity and deal (`activity_id`, `deal_id`), same as
      `stg_pipedrive__activities`. **Join on both**: some `activity_id`s are reused on two deals.


      **Transformations and business logic**: `left join` to `stg_pipedrive__activity_types` on
      `activity_type` (n:1), adding `activity_type_name` and `is_activity_type_active`. No row is
      dropped or multiplied (`equal_rowcount` test); all other columns are unchanged.


      **Edge cases**: activities of the inactive type `follow_up` are kept:
      `is_activity_type_active` describes the type today, not whether the activity happened.


      **Refresh**: table, rebuilt daily on every `dbt run`. The source is a static load, so no
      freshness check.
    config:
      tags: ["pipedrive", "daily"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:   # the grain: (activity_id, deal_id)
          arguments:
            combination_of_columns: ["activity_id", "deal_id"]
      - dbt_utils.equal_rowcount:   # the lookup join must not drop or multiply activities
          arguments:
            compare_model: ref('stg_pipedrive__activities')
    columns:
      - name: activity_id
        description: "{{ doc('activity__activity_id') }}"
        data_tests:
          - not_null   # part of the grain
      - name: deal_id
        description: "{{ doc('deal_id') }}"
        data_tests:
          - not_null   # part of the grain
      - name: assigned_user_id
        description: "{{ doc('activity__assigned_to_user') }}"
      - name: activity_type_id
        description: "{{ doc('activity_types__id') }}"
        data_tests:
          - not_null   # proves the left join matched every activity
      - name: activity_type
        description: "{{ doc('activity_type') }}"
      - name: activity_type_name
        description: "{{ doc('activity_types__name') }}"
        data_tests:
          - not_null   # proves the left join matched every activity
      - name: is_done
        description: "{{ doc('stg_pipedrive__activities__is_done') }}"
      - name: is_activity_type_active
        description: "{{ doc('stg_pipedrive__activity_types__is_activity_type_active') }}"
        data_tests:
          - not_null   # proves the left join matched every activity
      - name: due_at
        description: "{{ doc('activity__due_to') }}"
