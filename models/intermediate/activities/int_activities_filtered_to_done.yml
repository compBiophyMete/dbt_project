version: 2

models:
  - name: int_activities_filtered_to_done
    description: >
      Pipedrive sales activities that were done, with their activity type. Feeds every KPI that
      counts activities that happened, e.g. the Sales Call 1 / Sales Call 2 steps of
      `rep_sales_funnel_monthly` and done calls per user or deal.


      **Grain**: one row per activity and deal (`activity_id`, `deal_id`). **Join on both**


      **Transformations and business logic**:

      - Keeps the rows of `int_activities_joined_to_types` with `is_done = true`, the only column that says whether an activity happened.

      - `is_activity_type_active` is not a filter: it is the state of the type, not of the activity. It is kept so downstream models can warn when a counted type is deactivated.



      **Edge cases**:

      - Done Follow Up Calls (`follow_up`, an inactive type) are kept. Evidence: `analyses/profile_activity_done_and_types.sql`.

      - `due_at` is the planned date, the only activity date in the source; for a done activity it stands in for when it happened.


      **Refresh**: table, rebuilt daily on every `dbt run`. The source is a static load, so no
      freshness check.
    config:
      tags: ["pipedrive", "daily"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:   # the grain: (activity_id, deal_id)
          arguments:
            combination_of_columns: ["activity_id", "deal_id"]
    columns:
      - name: activity_id
        description: "{{ doc('activity__activity_id') }}"
        data_tests:
          - not_null   # part of the grain
      - name: deal_id
        description: "{{ doc('deal_id') }}"
        data_tests:
          - not_null   # part of the grain
      - name: assigned_user_id
        description: "{{ doc('activity__assigned_to_user') }}"
      - name: activity_type_id
        description: "{{ doc('activity_types__id') }}"
        data_tests:
          - not_null   # every done activity keeps its type
      - name: activity_type
        description: "{{ doc('activity_type') }}"
      - name: activity_type_name
        description: "{{ doc('activity_types__name') }}"
      - name: is_activity_type_active
        description: "{{ doc('stg_pipedrive__activity_types__is_activity_type_active') }}"
      - name: due_at
        description: "{{ doc('activity__due_to') }}"
        data_tests:
          - not_null   # a done activity needs a date to be counted in a month
