version: 2

models:
  - name: int_deal_changes_filtered_to_stages
    description: >
      Stage history of Pipedrive deals: a deal moved into a pipeline stage at a point in time.

      **Grain**: one row per deal and stage change (`deal_id`, `changed_at`). **Join on both**: a
      join on `deal_id` alone returns the deal's whole stage history.


      **Transformations and business logic**:

      - Keeps the `stage_id` rows of `stg_pipedrive__deal_changes`; `new_value_integer` becomes `stage_id`.

      - No `stage_name` and no per-deal attributes: appended rows are never rewritten, so join `stg_pipedrive__stages` on `stage_id` downstream; current stage and flags are computed downstream.

      - Incremental `append`: a `not exists` on (`deal_id`, `changed_at`) skips rows already loaded, and a unique index rejects any duplicate.

      - `dwh_date`: start of the dbt run that appended the row.

      - Deletes: a `post_hook` (`delete_rows_missing_upstream`) removes stage changes no longer upstream, e.g. of a deal deleted or merged in Pipedrive.


      **Edge cases**:

      - Skipped stages are common (e.g. stage 1 straight to 3). Rows are kept as recorded; whether a skipped stage counts as entered is decided downstream. Evidence: `analyses/profile_stage_skips.sql`.

      - A deal's first stage is expected to be stage 1 (Lead Generation); the warning test `assert_deals_start_at_stage_1` flags exceptions.

      - Deal IDs with two creations are the only deals with backward moves or revisits (two lifecycles under one ID). All rows are kept; `int_deals` flags them. Evidence: `analyses/profile_shared_deal_ids_timeline.sql`.

      - A stage change older than the lookback window is missed until a wider `lookback_days` or a `--full-refresh`.

      - `on_schema_change: fail`: an upstream column change fails the run until a `--full-refresh`.


      **Refresh**: daily, incremental on `changed_at` with a lookback of 2 days, 8 on Mondays
      (UTC). The source is a static load today, so no freshness check.
    config:
      materialized: incremental
      incremental_strategy: append
      on_schema_change: fail
      indexes:
        # changed_at first: serves the max(changed_at) watermark and the dedup anti-join; rejects duplicates
        - columns: ["changed_at", "deal_id"]
          unique: true
      tags:
        - pipedrive
        - daily
        - incremental
    data_tests:
      - dbt_utils.unique_combination_of_columns:   # the grain; reports a duplicate the dedup missed
          arguments:
            combination_of_columns: ["deal_id", "changed_at"]
    columns:
      - name: deal_id
        description: "{{ doc('deal_id') }}"
        data_tests:
          - not_null   # part of the grain
      - name: stage_id
        description: "{{ doc('stage_id') }}"
        data_tests:
          - not_null   # given its meaning here; its match to stg_pipedrive__stages is tested upstream
      - name: changed_at
        description: "{{ doc('int_deal_changes_filtered_to_stages__changed_at') }}"
        data_tests:
          - not_null   # part of the grain and the watermark column
      - name: dwh_date
        description: "{{ doc('dwh_date') }}"
        data_tests:
          - not_null
