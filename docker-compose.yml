version: '3.8'

# Credentials come from the DBT_* variables in your local .env (see README → Credentials).
# The values after ":-" are local-only fallbacks so the stack still starts without a .env.
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${DBT_DATABASE:-postgres}
      POSTGRES_USER: ${DBT_USER:-admin}
      POSTGRES_PASSWORD: ${DBT_PASSWORD:-admin}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./raw_data:/raw_data  # Mount raw_data folder to access CSV files
    ports:
      - "${DBT_PORT:-5432}:5432"

  data_loader:
    image: postgres:latest
    depends_on:
      - db
    volumes:
      - ./raw_data:/raw_data
    entrypoint: /bin/bash /raw_data/load_data.sh
    environment:
      PGUSER: ${DBT_USER:-admin}
      PGPASSWORD: ${DBT_PASSWORD:-admin}
      PGDATABASE: ${DBT_DATABASE:-postgres}
    links:
      - db
